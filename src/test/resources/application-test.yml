# Perfil de los tests que necesitan base de datos: en memoria y recreada en
# cada arranque, para que la suite no toque el fichero real del almacén ni
# dependa de lo que haya aprendido el programa en esta máquina.
#
# El nombre de la base lleva un sufijo aleatorio (una vez por contexto de
# Spring, no por test) para que dos @SpringBootTest con propiedades distintas
# —por ejemplo las taras fijas de PackingListControllerTest— no compartan la
# misma base en memoria: con Flyway + validate ya no hay create-drop que la
# vacíe en cada arranque, y una base con el nombre fijo dejaría lo sembrado
# por el primer contexto visible al siguiente.
#
# CASE_INSENSITIVE_IDENTIFIERS=TRUE evita un desajuste de mayúsculas propio de
# H2: Flyway crea su tabla flyway_schema_history entrecomillada y en
# minúsculas (para que su nombre no dependa de cada motor), mientras que nuestro
# propio V1__esquema_inicial.sql, sin entrecomillar, lo escribe H2 en
# mayúsculas por defecto. Sin esto, una consulta sin entrecomillar contra
# flyway_schema_history no encontraría la tabla.
spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
  jpa:
    hibernate:
      ddl-auto: validate

# Sin Azure Speech en los tests aunque la máquina tenga AZURE_SPEECH_KEY: las
# notas de voz de los tests quedan NO_APLICA y nunca se llama a Azure ni, por
# tanto, al resumen de Claude (que solo corre tras una transcripción hecha).
# TranscripcionServiceTest pone sus propios falsos.
modelos:
  azure-speech:
    clave: ""
  # Ni el resumen de Claude aunque la máquina tenga ANTHROPIC_API_KEY: ningún
  # contexto de test puede construir el resumidor de verdad
  # (TranscripcionConfig).
  resumen-ia:
    activo: false
  # Ni Web Push aunque la máquina tenga MODELOS_VAPID_*: los avisos al móvil
  # quedan apagados (EnviadorPushDesactivado); PushTest pone uno falso.
  push:
    vapid-public: ""
    vapid-private: ""
  # Ni la revisión de los recordatorios de cada hora: RecordatoriosTest llama a
  # revisar(ahora) con la hora que le conviene, y una revisión programada a
  # mitad de la suite mandaría pushes de las modificaciones de otros tests.
  recordatorios:
    activo: false
    # Los plazos, fijados aquí y no heredados de application.yml: los tests de
    # recordatorios cuentan días y horas contra estos números, así que afinar
    # los del yml de verdad (cada cuánto se insiste al taller o al despacho)
    # nunca pone la suite en rojo.
    taller:
      dias-por-prioridad: { ALTA: 1, NORMAL: 3, BAJA: 7 }
    despacho:
      sin-prioridad-horas: 24
      sin-aplicar-dias: 7
      respuesta-pendiente-horas: 24
