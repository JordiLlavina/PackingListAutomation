<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Entrada')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('· 1. Entrada del envío')}"></header>
<main>
    <div class="alerta ok" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alerta error" th:if="${errorJson}" th:text="${errorJson}"></div>

    <!-- Selector del modo de entrada: solo uno activo a la vez. FORMULARIO
         está deshabilitado hasta que se implemente la entrada manual. -->
    <div class="selector-modo" role="tablist">
        <button type="button" id="botonModoJSON" data-modo="JSON">JSON</button>
        <button type="button" id="botonModoCLAUDE" data-modo="CLAUDE">CLAUDE</button>
        <button type="button" id="botonModoFORMULARIO" data-modo="FORMULARIO"
                disabled title="Próximamente">FORMULARIO</button>
    </div>

    <form id="formEntrada" class="tarjeta" th:action="@{/importar}" th:object="${envioForm}"
          method="post" enctype="multipart/form-data">
        <input type="hidden" id="modo" th:field="*{modo}">
        <div>
            <label for="cliente">Cliente</label>
            <select id="cliente" th:field="*{cliente}">
                <option value="">-- selecciona un cliente --</option>
                <option th:each="entrada : ${clientes}"
                        th:value="${entrada.key}" th:text="${entrada.value.nombre}"></option>
            </select>
            <p class="error-campo" th:errors="*{cliente}"></p>
        </div>

        <div id="camposAmi" class="campos-cabecera">
            <div>
                <label for="ciudadProveedor">Ciudad del proveedor</label>
                <input type="text" id="ciudadProveedor" th:field="*{ciudadProveedor}" placeholder="Badalona">
            </div>
            <div>
                <label for="paisProveedor">País del proveedor</label>
                <input type="text" id="paisProveedor" th:field="*{paisProveedor}" placeholder="Spain">
            </div>
        </div>

        <div id="bloqueJson">
            <label for="json">JSON del envío</label>
            <textarea id="json" class="json" th:field="*{json}"
                      placeholder='{"cliente": "AMI", "destinos": [ ... ]}'></textarea>
            <p class="error-campo" th:errors="*{json}"></p>
        </div>

        <div id="bloqueClaude" style="display: none">
            <label for="imagenes">Imágenes del packing list</label>
            <p class="ayuda">Sube las fotos o capturas del packing list (JPEG, PNG, WebP o GIF).
                Claude las transcribirá al JSON del envío y pasarás a la revisión como siempre.</p>
            <input type="file" id="imagenes" name="imagenes" multiple
                   accept="image/jpeg,image/png,image/webp,image/gif">
            <p class="error-campo" th:errors="*{imagenes}"></p>
        </div>

        <div class="campos-cabecera">
            <div>
                <label for="temporada">Temporada</label>
                <input type="text" id="temporada" th:field="*{temporada}" placeholder="H26">
                <p class="error-campo" th:errors="*{temporada}"></p>
            </div>
            <div>
                <label for="numeroFactura">Nº de factura</label>
                <input type="text" id="numeroFactura" th:field="*{numeroFactura}" placeholder="FA-26-1189">
                <p class="error-campo" th:errors="*{numeroFactura}"></p>
            </div>
            <div>
                <label for="fechaFactura">Fecha factura (dd/MM/yyyy)</label>
                <input type="text" id="fechaFactura" th:field="*{fechaFactura}">
                <p class="error-campo" th:errors="*{fechaFactura}"></p>
            </div>
            <div>
                <label for="fechaEnvio">Fecha envío (dd/MM/yyyy)</label>
                <input type="text" id="fechaEnvio" th:field="*{fechaEnvio}">
                <p class="error-campo" th:errors="*{fechaEnvio}"></p>
            </div>
        </div>

        <button type="submit" id="botonImportar">Importar y revisar</button>
    </form>
    <p id="avisoProcesando" class="aviso-procesando" style="display: none">
        Procesando... con Claude puede tardar 1-2 minutos, no cierres ni recargues la página.
    </p>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const CLIENTES = /*[[${clientesJs}]]*/ {};
        /*]]>*/

        function actualizarCamposCliente() {
            const clienteSelect = document.getElementById('cliente');
            const config = CLIENTES[clienteSelect.value];
            const camposAmi = document.getElementById('camposAmi');
            const temporada = document.getElementById('temporada');
            const json = document.getElementById('json');

            const esAmi = config && config.plantilla === 'AMI';
            camposAmi.style.display = esAmi ? '' : 'none';

            if (config && config.placeholderTemporada) {
                temporada.placeholder = config.placeholderTemporada;
            }
            if (clienteSelect.value) {
                json.placeholder = '{"cliente": "' + clienteSelect.value + '", "destinos": [ ... ]}';
            }
        }

        document.getElementById('cliente').addEventListener('change', actualizarCamposCliente);
        actualizarCamposCliente();

        // --- Selector de modo de entrada (JSON / CLAUDE / FORMULARIO) ---

        function seleccionarModo(modo) {
            document.getElementById('modo').value = modo;
            document.getElementById('bloqueJson').style.display = modo === 'JSON' ? '' : 'none';
            document.getElementById('bloqueClaude').style.display = modo === 'CLAUDE' ? '' : 'none';
            document.querySelectorAll('.selector-modo button').forEach(function (boton) {
                boton.classList.toggle('activo', boton.dataset.modo === modo);
            });
            document.getElementById('botonImportar').textContent =
                modo === 'CLAUDE' ? 'Extraer con Claude y revisar' : 'Importar y revisar';
        }

        document.querySelectorAll('.selector-modo button:not([disabled])')
            .forEach(function (boton) {
                boton.addEventListener('click', function () {
                    seleccionarModo(boton.dataset.modo);
                });
            });

        // Al volver con errores de validación se conserva el modo enviado.
        seleccionarModo(document.getElementById('modo').value || 'JSON');

        // El envío en modo CLAUDE llama a la API y puede tardar 1-2 minutos;
        // sin esto la página se queda igual y parece colgada.
        document.getElementById('formEntrada').addEventListener('submit', function () {
            const boton = document.getElementById('botonImportar');
            boton.disabled = true;
            boton.textContent = 'Procesando...';
            document.getElementById('avisoProcesando').style.display = '';
        });
    </script>
</main>
</body>
</html>
