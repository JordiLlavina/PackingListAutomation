<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Revisión')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('· 2. Revisión')}"></header>
<main>
    <div class="alerta error" th:if="${error}" th:text="${error}"></div>

    <section th:if="${!avisosImportacion.isEmpty() or !avisosPalets.isEmpty()
                     or !avisosInferencia.isEmpty() or !cajasSinPalet.isEmpty()}">
        <h2>Avisos</h2>
        <div class="alerta" th:each="aviso : ${avisosImportacion}"
             th:text="|Importación: ${aviso}|"></div>
        <div class="alerta" th:each="aviso : ${avisosPalets}"
             th:text="|Palets: ${aviso}|"></div>
        <div class="alerta error" th:each="aviso : ${avisosInferencia}"
             th:text="|Pesos: ${aviso}|"></div>
        <div class="alerta error" th:each="caja : ${cajasSinPalet}"
             th:text="|Sin palet: la caja ${caja.numeroCaja} (${caja.referencia} ${caja.codigoColor}) no cae en ningún rango de palet|"></div>
    </section>

    <!-- action por defecto: generar. Los botones de recálculo usan formaction. -->
    <form th:action="@{/generar}" method="post">
        <section class="destino" th:each="destino : ${destinos}">
            <h2 th:text="|${destino.nombre} (${destino.filas.size()} cajas)|"></h2>
            <table>
                <thead>
                <tr>
                    <th>Caja</th>
                    <th>Pedido</th>
                    <th>Referencia</th>
                    <th>Color</th>
                    <th>Cantidad</th>
                    <th>Tamaño</th>
                    <th>Palet</th>
                    <th>Neto (kg)</th>
                    <th>Bruto (kg)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fila : ${destino.filas}"
                    th:classappend="${fila.cajaPendiente} ? 'pendiente'">
                    <td th:text="${fila.caja.numeroCaja}"></td>
                    <td th:text="${fila.caja.numeroPedido}"></td>
                    <td th:text="${fila.caja.referencia}"></td>
                    <td th:text="${fila.caja.codigoColor}"></td>
                    <td th:text="${fila.caja.cantidad}"></td>
                    <td th:text="${fila.caja.tamanoCaja}"></td>
                    <td>
                        <span th:if="${fila.caja.numeroPalet != null}" th:text="${fila.caja.numeroPalet}"></span>
                        <span th:if="${fila.caja.numeroPalet == null}" class="sin-palet">—</span>
                    </td>
                    <!-- El peso es de la caja física entera: solo su primera
                         línea (esLider) muestra campos; las demás tallas de la
                         misma caja los dejan en blanco. -->
                    <td>
                        <th:block th:if="${fila.esLider}">
                            <input type="hidden" th:name="|pesos[${fila.indiceGlobal}].indiceDestino|"
                                   th:value="${destino.indice}">
                            <input type="hidden" th:name="|pesos[${fila.indiceGlobal}].indiceCaja|"
                                   th:value="${fila.indiceEnDestino}">
                            <input type="number" step="0.01" min="0"
                                   th:name="|pesos[${fila.indiceGlobal}].pesoNetoKg|"
                                   th:value="${fila.caja.pesoNetoKg}">
                        </th:block>
                    </td>
                    <td>
                        <input th:if="${fila.esLider}" type="number" step="0.01" min="0"
                               th:name="|pesos[${fila.indiceGlobal}].pesoBrutoKg|"
                               th:value="${fila.caja.pesoBrutoKg}">
                    </td>
                    <td>
                        <!-- Propaga el peso tecleado en esta fila a todas las
                             cajas de su modelo (mismo recálculo global). -->
                        <button th:if="${fila.esLider}" type="submit" class="mini" th:formaction="@{/recalcular}"
                                title="Aplicar este peso a todas las cajas del mismo modelo">recalcula peso</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <button type="submit" class="secundario" th:formaction="@{/recalcular}">Recalcular pesos</button>
        <button type="submit">Generar excels</button>
        <a class="boton secundario" th:href="@{/nuevo}">Empezar de nuevo</a>
    </form>
</main>

<script>
    // Recalcular usa POST-redirect-GET: la página se recarga entera y el
    // navegador salta arriba. Thymeleaf no puede evitarlo (el scroll es
    // estado del navegador), así que guardamos la posición antes de recalcular
    // y la restauramos al recargar. "Generar excels" lleva a otra pantalla, por
    // eso no se toca: ahí el scroll arriba es el comportamiento correcto.
    (function () {
        var CLAVE = 'revisionScroll';
        document.addEventListener('DOMContentLoaded', function () {
            var guardado = sessionStorage.getItem(CLAVE);
            sessionStorage.removeItem(CLAVE);
            if (guardado !== null) {
                window.scrollTo(0, parseInt(guardado, 10));
            }
            document.querySelectorAll('button[formaction$="/recalcular"]').forEach(function (boton) {
                boton.addEventListener('click', function () {
                    sessionStorage.setItem(CLAVE, String(window.scrollY));
                });
            });
        });
    })();
</script>
</body>
</html>
