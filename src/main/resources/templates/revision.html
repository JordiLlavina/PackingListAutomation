<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Revisión')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('· 2. Revisión')}"></header>
<main>
    <div class="alerta error" th:if="${error}" th:text="${error}"></div>

    <section th:if="${!avisosImportacion.isEmpty() or !avisosPalets.isEmpty()
                     or !avisosInferencia.isEmpty() or !cajasSinPalet.isEmpty()}">
        <h2>Avisos</h2>
        <div class="alerta" th:each="aviso : ${avisosImportacion}"
             th:text="|Importación: ${aviso}|"></div>
        <div class="alerta" th:each="aviso : ${avisosPalets}"
             th:text="|Palets: ${aviso}|"></div>
        <div class="alerta error" th:each="aviso : ${avisosInferencia}"
             th:text="|Pesos: ${aviso}|"></div>
        <div class="alerta error" th:each="caja : ${cajasSinPalet}"
             th:text="|Sin palet: la caja ${caja.numeroCaja} (${caja.referencia} ${caja.codigoColor}) no cae en ningún rango de palet|"></div>
    </section>

    <!-- action por defecto: generar. Los botones de recálculo usan formaction. -->
    <form th:action="@{/generar}" method="post">
        <section class="destino" th:each="destino : ${destinos}">
            <h2 th:text="|${destino.nombre} (${destino.totalCajas} cajas)|"></h2>
            <!-- El Livraison code es de la destinación entera, no de una caja:
                 va en la cabecera y no como columna, que se repetiría en cada
                 fila y ensuciaría la compactación. Se genera con el contador a
                 1 porque la app no tiene historial de envíos: si este no es el
                 primer envío del día a esa destinación, corrígelo aquí. -->
            <div class="campo-destino" th:if="${destino.livraisonCode != null}">
                <input type="hidden" th:name="|destinos[${destino.indice}].indiceDestino|"
                       th:value="${destino.indice}">
                <label th:for="|livraison-${destino.indice}|">Livraison code</label>
                <input type="text" th:id="|livraison-${destino.indice}|"
                       th:name="|destinos[${destino.indice}].livraisonCode|"
                       th:value="${destino.livraisonCode}">
            </div>
            <table>
                <thead>
                <tr>
                    <th class="c-desplegar"></th>
                    <th>Referencia</th>
                    <th>Color</th>
                    <th>Talla</th>
                    <th>Pedido</th>
                    <th>Caja</th>
                    <th>Tamaño</th>
                    <th>Cantidad</th>
                    <th>Palet</th>
                    <th>Bruto (kg)</th>
                    <th>Neto (kg)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <!-- Todos los campos son editables: la extracción por fotos
                     puede leer mal cualquiera de ellos, no solo un peso. Un
                     campo que se deja vacío no borra nada ("no tocar").

                     Los índices ocultos identifican a qué cajas se aplica la
                     fila: la POSICIÓN de cada una en su destinación, nunca su
                     número (se repite en cajas mixtas). Una fila compactada
                     manda un índice por caja del tramo. -->
                <!-- Dos clases al fondo de la fila: la banda de color de su
                     palet —los palets de la destinación van rotando la paleta,
                     así el cambio de palet se ve sin leer la columna— y, si la
                     caja no tiene los dos pesos, el amarillo de pendiente, que
                     el CSS pinta encima de la banda. -->
                <tr th:each="fila : ${destino.filas}"
                    th:classappend="${fila.claseBandaPalet}
                                    + (${fila.cajaPendiente} ? ' pendiente' : '')">
                    <!-- El triángulo va fuera de la tabla de datos, en su
                         propia columna: ▶ despliega el tramo compactado en sus
                         cajas, ▼ lo vuelve a plegar. Es un submit del mismo
                         formulario, así que lo ya tecleado se aplica antes de
                         recargar. Las filas de una sola caja no lo llevan. -->
                    <td class="c-desplegar">
                        <button th:if="${fila.alternable}" type="submit" class="triangulo"
                                th:formaction="@{/alternar-fila(destino=${destino.indice},
                                                                indice=${fila.indicesEnDestino[0]})}"
                                th:text="${fila.desplegada} ? '▼' : '▶'"
                                th:title="${fila.desplegada}
                                          ? 'Plegar estas cajas en una sola fila'
                                          : 'Desplegar el tramo para editar cada caja por separado'"></button>
                    </td>
                    <td>
                        <input type="hidden" th:name="|cajas[${fila.indiceGlobal}].indiceDestino|"
                               th:value="${destino.indice}">
                        <input type="hidden" th:each="indice : ${fila.indicesEnDestino}"
                               th:name="|cajas[${fila.indiceGlobal}].indicesCaja|"
                               th:value="${indice}">
                        <input type="text" class="c-referencia"
                               th:name="|cajas[${fila.indiceGlobal}].referencia|"
                               th:value="${fila.caja.referencia}">
                    </td>
                    <td><input type="text" class="c-color"
                               th:name="|cajas[${fila.indiceGlobal}].codigoColor|"
                               th:value="${fila.caja.codigoColor}"></td>
                    <td><input type="text" class="c-talla"
                               th:name="|cajas[${fila.indiceGlobal}].talla|"
                               th:value="${fila.caja.talla}"></td>
                    <td><input type="text" class="c-pedido"
                               th:name="|cajas[${fila.indiceGlobal}].numeroPedido|"
                               th:value="${fila.caja.numeroPedido}"></td>
                    <td class="c-caja">
                        <!-- Un tramo compactado ("4-8") no tiene un número que
                             teclear: hay que desplegarlo primero. -->
                        <input th:if="${fila.numeroCajaEditable}" type="number" min="1"
                               th:name="|cajas[${fila.indiceGlobal}].numeroCaja|"
                               th:value="${fila.caja.numeroCaja}">
                        <span th:unless="${fila.numeroCajaEditable}" th:text="${fila.rangoCajas}"></span>
                    </td>
                    <!-- El tamaño manda la tara con la que se infiere el neto,
                         así que el desplegable ofrece los de application.yml.
                         Un tamaño que NO esté en el catálogo se añade como
                         opción propia: quitarlo lo cambiaría en silencio al
                         guardar la fila. -->
                    <td>
                        <select class="c-tamano" th:name="|cajas[${fila.indiceGlobal}].tamanoCaja|">
                            <option value="" th:if="${fila.caja.tamanoCaja == null}"></option>
                            <option th:if="${fila.caja.tamanoCaja != null
                                             and !tamanosCaja.contains(fila.caja.tamanoCaja)}"
                                    th:value="${fila.caja.tamanoCaja}" th:selected="${true}"
                                    th:text="|${fila.caja.tamanoCaja} (sin tara)|"></option>
                            <option th:each="tamano : ${tamanosCaja}" th:value="${tamano}"
                                    th:selected="${tamano == fila.caja.tamanoCaja}"
                                    th:text="${tamano}"></option>
                        </select>
                    </td>
                    <!-- Cantidad de UNA caja, no la suma del tramo. -->
                    <td><input type="number" min="0" class="c-cantidad"
                               th:name="|cajas[${fila.indiceGlobal}].cantidad|"
                               th:value="${fila.caja.cantidad}"></td>
                    <td><input type="number" min="1" class="c-palet"
                               th:classappend="${fila.caja.numeroPalet == null} ? 'sin-palet'"
                               th:name="|cajas[${fila.indiceGlobal}].numeroPalet|"
                               th:value="${fila.caja.numeroPalet}"></td>
                    <!-- El peso es de la caja física entera: solo su primera
                         línea (esLider) muestra campos; las demás líneas de la
                         misma caja los dejan en blanco. -->
                    <td>
                        <input th:if="${fila.esLider}" type="number" step="0.01" min="0" class="c-peso"
                               th:name="|cajas[${fila.indiceGlobal}].pesoBrutoKg|"
                               th:value="${fila.caja.pesoBrutoKg}">
                    </td>
                    <td>
                        <input th:if="${fila.esLider}" type="number" step="0.01" min="0" class="c-peso"
                               th:name="|cajas[${fila.indiceGlobal}].pesoNetoKg|"
                               th:value="${fila.caja.pesoNetoKg}">
                    </td>
                    <td>
                        <!-- Propaga el peso tecleado en esta fila a todas las
                             cajas de su modelo (mismo recálculo global). Un
                             bulto con varios artículos o varias tallas no lo
                             ofrece: su peso es el de todos juntos y no hay
                             peso por unidad que llevarse a otras cajas. -->
                        <button th:if="${fila.puedeRecalcularPeso}" type="submit" class="mini"
                                th:formaction="@{/recalcular}"
                                title="Aplicar este peso a todas las cajas del mismo modelo">recalcula peso</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <button type="submit" class="secundario" th:formaction="@{/recalcular}">Recalcular pesos</button>
        <button type="submit">Generar excels</button>
        <a class="boton secundario" th:href="@{/nuevo}">Empezar de nuevo</a>
    </form>
</main>

<script>
    // Recalcular y desplegar una fila usan POST-redirect-GET: la página se
    // recarga entera y el navegador salta arriba. Thymeleaf no puede evitarlo
    // (el scroll es estado del navegador), así que guardamos la posición antes
    // y la restauramos al recargar. "Generar excels" lleva a otra pantalla, por
    // eso no se toca: ahí el scroll arriba es el comportamiento correcto.
    (function () {
        var CLAVE = 'revisionScroll';
        document.addEventListener('DOMContentLoaded', function () {
            var guardado = sessionStorage.getItem(CLAVE);
            sessionStorage.removeItem(CLAVE);
            if (guardado !== null) {
                window.scrollTo(0, parseInt(guardado, 10));
            }
            // *= y no $=: /alternar-fila lleva parámetros en la URL.
            document.querySelectorAll('button[formaction*="/recalcular"],'
                    + ' button[formaction*="/alternar-fila"]').forEach(function (boton) {
                boton.addEventListener('click', function () {
                    sessionStorage.setItem(CLAVE, String(window.scrollY));
                });
            });
        });
    })();
</script>
</body>
</html>
