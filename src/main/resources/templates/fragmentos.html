<!DOCTYPE html>
<!-- Fragmentos comunes a las pantallas del asistente. -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · Packing Lists|">Packing Lists</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <!-- Icono de la pestaña. Los dos PNG salen del logo de client-labels/img-web-icon.jpg:
         cuadrado añadiendo aire (el logo llega a los bordes y recortarlo le cortaría
         piezas) y sin el fondo blanco, para que se vea igual en pestaña clara u oscura. -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icono-web-32.png}">
    <link rel="icon" type="image/png" sizes="180x180" th:href="@{/icono-web-180.png}">
</head>
<body>
<header class="cabecera" th:fragment="cabecera(titulo)">
    <div class="titulo">
        <!-- El camino de vuelta al menú es la marca, no el título: el título
             dice en qué sección estás, y enlazarlo llevaría a otra distinta.
             La misma marca de la pestaña, que sobre la barra en tinta se lee
             igual de bien que sobre el blanco de la pestaña. -->
        <a th:href="@{/menu}" class="enlace-menu" title="Volver al menú"
           aria-label="Volver al menú">
            <img class="marca" th:src="@{/icono-web-180.png}" alt="" aria-hidden="true">
        </a>
        <span th:text="${titulo}">título de la sección</span>
    </div>
</header>
<!-- Piel de vaca extendida: el icono de los Documentos del Corte, en el menú
     y en sus resultados. Dibujado y no emoji, como los demás del menú. -->
<svg th:fragment="iconoPiel(clase)" th:class="${clase}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
     aria-hidden="true">
    <path d="M12 3.6C13 3.6 13.6 2.6 15 2.6C16.4 2.6 17 3.6 17.4 4.4C18.4 4.4 19.6 4.9 20.2 5.8C18.6 7 17.3 9.2 17.3 12C17.3 14.6 18.4 16.8 20.4 18.2C19 19.4 17.2 19.6 16 19.2C14.8 20.2 13.4 21 12 21.6C10.6 21 9.2 20.2 8 19.2C6.8 19.6 5 19.4 3.6 18.2C5.6 16.8 6.7 14.6 6.7 12C6.7 9.2 5.4 7 3.8 5.8C4.4 4.9 5.6 4.4 6.6 4.4C7 3.6 7.6 2.6 9 2.6C10.4 2.6 11 3.6 12 3.6Z"/>
</svg>
</body>
</html>
