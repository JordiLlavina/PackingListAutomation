<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Importar artículos')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('Envíos · Artículos')}"></header>
<main>
    <nav th:replace="~{fragmentos :: subnavEnvios('articulos')}"></nav>
    <div class="alerta ok" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alerta error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <section class="tarjeta">
        <p class="ayuda">Cabecera esperada: <code>referencia,descripcion,codigo_hs,pais_origen,peso_neto,peso_bruto,valor_unitario</code>.
            La coma decimal se acepta.</p>
        <form th:action="@{/envios/articulos/importar}" method="post" enctype="multipart/form-data" class="form-fila">
            <input type="file" name="fichero" accept=".csv" required>
            <button type="submit">Ver qué se importaría</button>
        </form>
    </section>

    <div th:if="${previsualizacion}">
        <p class="ayuda">Las filas con error no se importan. Una referencia que ya existe se actualiza.</p>

        <form th:action="@{/envios/articulos/importar/confirmar}" method="post">
            <section class="tarjeta">
                <h3 class="titulo-seccion" th:text="|Listas para importar (${previsualizacion.validas().size()})|"></h3>
                <table class="tabla-mantenimiento">
                    <thead>
                    <tr>
                        <th>Fila</th><th>Referencia</th><th>Descripción</th><th>HS</th><th>Origen</th>
                        <th>Neto</th><th>Bruto</th><th>Valor</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${previsualizacion.validas()}">
                        <td th:text="${f.numero}"></td>
                        <td th:text="${f.referencia}"></td>
                        <td th:text="${f.descripcion}"></td>
                        <td th:text="${f.codigoHs}"></td>
                        <td th:text="${f.paisOrigen}"></td>
                        <td th:text="${f.pesoNeto}"></td>
                        <td th:text="${f.pesoBruto}"></td>
                        <td th:text="${f.valorUnitario}"></td>
                        <td th:text="${f.yaExiste} ? 'Ya existe → se actualizará' : ''"></td>
                    </tr>
                    </tbody>
                </table>
            </section>

            <section class="tarjeta">
                <h3 class="titulo-seccion" th:text="|Con errores (${previsualizacion.erroneas().size()})|"></h3>
                <table class="tabla-mantenimiento">
                    <thead>
                    <tr><th>Fila</th><th>Referencia</th><th>Errores</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${previsualizacion.erroneas()}">
                        <td th:text="${f.numero}"></td>
                        <td th:text="${f.referencia}"></td>
                        <td th:text="${#strings.listJoin(f.errores, ' ')}"></td>
                    </tr>
                    </tbody>
                </table>
            </section>

            <button type="submit">Importar</button>
        </form>
    </div>
</main>
</body>
</html>
