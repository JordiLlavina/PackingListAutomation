# Configuración del generador de packing lists.
#
# Límites de subida de ficheros: las fotos de packing lists del móvil
# superan de sobra el 1MB por defecto de Spring.
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

  # Base de datos embebida en fichero: la memoria de referencias y la tabla
  # de taras tienen que sobrevivir al reinicio. El fichero vive junto al
  # ejecutable y no se versiona; borrarlo solo pierde lo aprendido, no rompe
  # nada, porque las taras se resiembran del bloque packing-list.taras.
  datasource:
    url: jdbc:h2:file:./datos/packinglist;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # El esquema lo crean las migraciones de Flyway. "validate" solo
      # comprueba que las entidades y las tablas cuadran: si no cuadran, la
      # aplicación no arranca, que es exactamente lo que se quiere. Volver a
      # "update" aquí anula toda la fase 2.
      ddl-auto: validate
    open-in-view: false

  flyway:
    # {vendor} se sustituye por "h2" o "postgresql" según el datasource. Solo
    # el baseline está ahí; de V2 en adelante todo va en common.
    locations: classpath:db/migration/{vendor},classpath:db/migration/common
    # La base de datos del almacén ya tiene las tablas creadas por Hibernate:
    # sin esto, Flyway se niega a correr sobre un esquema que no está vacío.
    baseline-on-migrate: true
    baseline-version: 1

  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET}
            scope: openid, profile, email
            # Explícitos porque el perfil de test describe el proveedor sin
            # issuer-uri, y sin descubrimiento Spring no los da por supuestos.
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  # El CSS y el JS se sirven con un hash del contenido en el nombre
  # (/estilo-a1b2c3.css): sin esto el navegador se queda con la copia vieja
  # tras cada cambio de estilos y hay que vaciar la caché a mano.
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths: /**

#
# Taras conocidas (kg de embalaje vacío) por tamaño de caja "LxWxH" en cm.
# Para soportar un tamaño nuevo basta con añadirlo aquí; las claves van
# entre [] y comillas para que Spring las respete tal cual.
packing-list:
  taras:
    "[60x40x51]": 0.01
    "[60x40x45]": 1.08
    "[60x40x40]": 1.06
    "[60x40x30]": 0.01
    "[40x30x20]": 0.78

  # Reglas de la entrada por packing list de taller: cómo se reparte lo que
  # llega y cómo se llenan cajas y palets. El packing del taller no se
  # respeta; se regenera con esto.
  #
  # prioridad: número menor = se sirve antes cuando falta género. Empate =
  #   mismo escalón, y entonces el reparto es proporcional al objetivo.
  # mezcla: NINGUNA (una referencia y un color por caja), MISMO_PEDIDO (solo
  #   entre artículos del mismo pedido) o LIBRE.
  # altura-max-cm: la de la destinación. Una hija que no la declare hereda la
  #   de su padre, y si tampoco, altura-palet-por-defecto-cm. Por eso
  #   CHINE FRANCH no la lleva: viaja al almacén de WHOLESALE.
  # numeracion-cajas: CONTINUA numera seguido entre destinaciones (AMI);
  #   POR_DESTINACION reinicia en cada una (APC y el resto).
  #
  # Añadir una destinación es una línea aquí. Un cliente sin bloque propio
  # tiene destino único, mezcla LIBRE y la altura que teclee el usuario.
  taller:
    altura-palet-por-defecto-cm: 168
    altura-propia-palet-cm: 11
    posiciones-palet: 4
    medida-caja-por-defecto: 60x40x40
    clientes:
      "[AMI]":
        numeracion-cajas: CONTINUA
        # El PO del pedido de AMI lleva la destinación pegada como sufijo
        # ("07704 CH"). Un sufijo que no esté aquí no se adivina: se avisa y
        # no se deja generar.
        sufijos-po:
          "[CH]": CHINA
          "[JP]": JAPAN
        destino-sin-sufijo: PARIS
        destinos:
          "[CHINA]": { altura-max-cm: 158, prioridad: 1, mezcla: NINGUNA }
          "[JAPAN]": { altura-max-cm: 158, prioridad: 1, mezcla: NINGUNA }
          "[PARIS]": { altura-max-cm: 168, prioridad: 2, mezcla: MISMO_PEDIDO }
      "[APC]":
        numeracion-cajas: POR_DESTINACION
        # Van las destinaciones HIJAS, no solo los padres: la prioridad se
        # pregunta por la hija (CHINE FRANCH cuelga de WHOLESALE y sin
        # embargo se sirve de las primeras), y una hija que no esté aquí
        # bloquea el envío entero. Los nombres son los de la columna "Notre
        # référence" del excel de pedido, que es de donde llegan.
        # La altura se hereda del padre si la hija no la declara.
        destinos:
          "[CHINE FRANCH]":  { prioridad: 1, mezcla: LIBRE }
          "[AUSTRALIA]":     { prioridad: 1, mezcla: LIBRE }
          "[JAPAN]":         { altura-max-cm: 155, prioridad: 1, mezcla: LIBRE }
          "[KOREA]":         { altura-max-cm: 155, prioridad: 1, mezcla: LIBRE }
          "[D. USA]":        { altura-max-cm: 155, prioridad: 2, mezcla: LIBRE }
          "[DOUANES USA]":   { prioridad: 2, mezcla: LIBRE }
          "[RETAIL]":        { altura-max-cm: 168, prioridad: 3, mezcla: LIBRE }
          "[WHOLESALE]":     { altura-max-cm: 168, prioridad: 4, mezcla: LIBRE }

  # Catálogo de clientes. Añadir un cliente nuevo de plantilla GENERIC =
  # añadir aquí su bloque (nombre-legal + direccion-entrega), sin tocar Java.
  # El orden de este bloque es el orden del desplegable de la web.
  clientes:
    "[AMI]":
      nombre: AMI
      plantilla: AMI
      placeholder-temporada: H26
      # AMI no usa el pedido para el packing list, pero subirlo aquí evita
      # que el Paso 2 de etiquetas lo vuelva a pedir.
      pedido-cliente: true
      # Como llama AMI a su número de pedido. Es el rótulo que ve quien
      # teclea, así que va entero y no abreviado.
      etiqueta-pedido: "PO - Orden de Producto"
      # Destinos habituales (informativo, la plantilla los escribe tal cual
      # llegan del JSON): PARIS, CHINA, JAPAN, HONG KONG. Pueden llegar más.

    "[APC]":
      nombre: A.P.C.
      plantilla: APC
      placeholder-temporada: E25
      # APC manda su excel de pedido de la temporada: de ahí sale el número
      # de pedido completo (ver PedidoCompletionService).
      pedido-cliente: true
      # APC lo llama así en su excel de pedido, y es de diez dígitos.
      etiqueta-pedido: "Document d'achat"
      # abreviatura: la que APC usa en su Livraison code (columna
      #   "Catégorie de stock" de su excel de pedido).
      # destinos-hijo: destinaciones que viajan bajo este destino y se tratan
      #   como él; la hija solo sale en la columna DESTINATION de su línea.
      #   Añadir una hija nueva es UNA LÍNEA aquí, sin tocar Java.
      destinos:
        "[WHOLESALE]":
          nombre-cliente: A.P.C.
          direccion: CROSSLOG, 104 RUE DENIS PAPIN, 77550 MOISSY CRAMAYEL, FRANCE
          abreviatura: WH
          destinos-hijo: [AUSTRALIA, WHOLESALE, CHINE FRANCH]
        "[RETAIL]":
          nombre-cliente: A.P.C.
          direccion: 74 BIS AV MAURICE THOREZ 94200 IVRY SUR SEINE FRANCE
          abreviatura: RT
          destinos-hijo: [RETAIL, WHOLESALE CONCESS]
        "[D. USA]":
          nombre-cliente: A.P.C.-USNY-TOUITOU
          direccion: 43 BROOME STREET, 5TH FLOOR; 10013 NEW YORK; USA
          abreviatura: UST
          # "Douanes USA" es como llama APC a esta destinación en la columna
          # "Notre référence" de su excel de pedido; "D. USA" es como se
          # teclea a mano. Es el mismo sitio, así que entra como hija para
          # que el envío que viene del pedido acabe en este mismo fichero.
          destinos-hijo: [DOUANES USA, D. USA]
        "[IVRY]":
          nombre-cliente: A.P.C.
          direccion: 74 BIS AV MAURICE THOREZ 94200 IVRY SUR SEINE FRANCE
          abreviatura: IVRY
        "[JAPAN]":
          nombre-cliente: A.P.C. JAPAN LTD.
          direccion: 4F AOYAMA 1-CHOME BUILDING; 8-5-30, AKASAKA,MINATO-KU; TOKYO
          abreviatura: JPT
        "[KOREA]":
          nombre-cliente: I.D.LOOK. LTD.
          direccion: 6TH FL. PUREUN BLDG. 581, GANGNAMDE-RO, SEOCHO-GU, 06530 SEOUL,SOUTH KOREA
          abreviatura: KRT

    "[ACKERMANN]":
      nombre: Ackermann
      plantilla: GENERIC
      nombre-legal: ACKERMANN HOHMANN UND SEDLACEK OHG
      direccion-entrega: Goseburgstraße 27, 21339 Lüneburg, Germany

    "[DROLE DU MONSIEUR]":
      nombre: Drole du Monsieur
      plantilla: GENERIC
      nombre-legal: MSDS
      direccion-entrega: ENTREPOT LOGISTIQUE NC; 17 Rue du noyer à la malice; 95380 LOUVRES, France

    "[KAMI]":
      nombre: Kami
      plantilla: GENERIC
      nombre-legal: KAMI SAS
      direccion-entrega: Ploiesti West Park DN72 PLOIESTI Targoviste-Road; 107025 Aricestii Rahtivani communne; ROMANIA

    "[LGN]":
      nombre: LGN
      plantilla: GENERIC
      nombre-legal: LGN C/O - STELLAE INTERNATIONAL FRANCE
      direccion-entrega: 47 BIS RUE ERNEST RENAN; 94200 IVRY SUR SEINE

    "[PALOMA WOOL]":
      nombre: Paloma Wool
      plantilla: GENERIC
      nombre-legal: PURO PASEO, S.L.
      direccion-entrega: GRUPO SEVICA - C/ DEL PROGRES, 4-6, POL.IND. LA POST- NAVE 3, 08850 GAVÀ (BARCELONA)

    "[PAUL & JOE]":
      nombre: Paul & Joe
      plantilla: GENERIC
      nombre-legal: MANEKI SAS
      direccion-entrega: PAUL&JOE; 14 RUE COMMINES, 75003 PARIS

    "[SONIA RYKIEL]":
      nombre: Sonia Rykiel
