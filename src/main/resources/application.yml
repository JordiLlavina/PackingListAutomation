      direccion-entrega: BLECKMANN - TRB INTERNATIONAL; INDUSTRIEWEG 38C; QUAI B12; 2280 GROBBENDONK, BELGIUM

# El primer administrador no puede salir de la propia aplicación: no hay
# nadie que se lo conceda. Esta lista se aplica SOLO en el alta de esos
# usuarios, no en cada entrada; si se aplicara siempre, quitarle el
# administrador a alguien de aquí sería imposible desde la pantalla.
seguridad:
  administradores-iniciales:
    - jllavinapamias@puntotres.com

# El proveedor de Entra va en un documento aparte, activo en todo perfil menos
# en "test": con el issuer-uri Spring sale a internet al arrancar a leer el
# documento de descubrimiento de Microsoft, y la suite no puede depender de que
# haya red ni tiene el tenant. El perfil de test declara los endpoints a mano
# (src/test/resources/application-test.yml) y la identidad se simula con
# oidcLogin(); la seguridad NO se desactiva en ningún perfil.
---
spring:
  config:
    activate:
      on-profile: "!test"
  security:
    oauth2:
      client:
        provider:
          azure:
            # El tenant dentro del issuer es lo que impide que entre nadie de
            # otro directorio: la validación del "iss" del token lo rechaza.
            # No hace falta comprobar el "tid" a mano.
            issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
